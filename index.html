<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>₱ AUTO Amount to Words</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:Arial,Helvetica,sans-serif;background:#050505}
.card{width:min(1000px,94%);background:#fff;padding:42px 44px 36px;border-radius:28px;box-shadow:0 18px 60px rgba(0,0,0,.45)}
h1{margin:0;font-size:36px;line-height:1}h1 .auto{color:#f00}.sub{color:#777;font-size:20px;margin:18px 0 34px}
.grid{display:grid;grid-template-columns:1fr 250px;gap:22px}
label{display:block;font-size:21px;font-weight:800;margin-bottom:12px}
.field{position:relative}
input{width:100%;height:92px;border:2px solid #ddd;border-radius:17px;background:#fff;padding:0 24px;font-size:34px;font-weight:700;color:#555;outline:none}
input:focus{border-color:#aaa;box-shadow:0 0 0 3px rgba(0,0,0,.06)}
.amount-input{padding-right:92px;text-align:right}
.suffix{position:absolute;right:25px;top:50%;transform:translateY(-50%);font-size:32px;font-weight:700;color:#555;pointer-events:none}
#centavos{text-align:center;letter-spacing:3px}
.result{margin-top:30px;min-height:108px;padding:25px;border-radius:17px;background:#f1f1f1;font-size:25px;font-weight:800;line-height:1.45;display:flex;align-items:center}
.buttons{display:flex;gap:14px}
button{margin-top:20px;border:0;border-radius:11px;padding:16px 25px;font-size:21px;font-weight:800;cursor:pointer;color:#fff}
.copy{background:#0505d8}.clear{background:#d00}
.hint{margin-top:18px;color:#777;font-size:16px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.card{padding:28px}input{font-size:26px}.suffix{font-size:25px}}
</style>
</head>
<body>
<div class="card">
<h1>₱ <span class="auto">AUTO</span> Amount to Words</h1>
<div class="sub">Enter the amount and centavos separately.</div>

<div class="grid">
<div>
<label for="amount">AMOUNT</label>
<div class="field">
<input id="amount" class="amount-input" type="text" inputmode="numeric" autocomplete="off" placeholder="1,000,000,000.00">
<span class="suffix" id="suffix">.00</span>
</div>
</div>

<div>
<label for="centavos">CENTAVOS</label>
<div class="field">
<input id="centavos" type="text" inputmode="numeric" maxlength="2" value="00" autocomplete="off">
</div>
</div>
</div>

<div class="result" id="result"></div>

<div class="buttons">
<button class="copy" onclick="copyResult()">COPY RESULT</button>
<button class="clear" onclick="clearAll()">CLEAR</button>
</div>

<div class="hint">START: CENTAVOS • Enter → AMOUNT • Enter on AMOUNT → Copy Result</div>
</div>

<script>
const ones=["","ONE","TWO","THREE","FOUR","FIVE","SIX","SEVEN","EIGHT","NINE","TEN","ELEVEN","TWELVE","THIRTEEN","FOURTEEN","FIFTEEN","SIXTEEN","SEVENTEEN","EIGHTEEN","NINETEEN"];
const tens=["","","TWENTY","THIRTY","FORTY","FIFTY","SIXTY","SEVENTY","EIGHTY","NINETY"];

function below1000(n){
 let s="";
 if(n>=100){s+=ones[Math.floor(n/100)]+" HUNDRED";n%=100;if(n)s+=" ";}
 if(n>=20){s+=tens[Math.floor(n/10)];if(n%10)s+="-"+ones[n%10];}
 else if(n>0)s+=ones[n];
 return s;
}
function words(n){
 if(n===0)return "ZERO";
 let s="";
 if(n>=1e12){s+=words(Math.floor(n/1e12))+" TRILLION";n%=1e12;if(n)s+=" ";}
 if(n>=1e9){s+=words(Math.floor(n/1e9))+" BILLION";n%=1e9;if(n)s+=" ";}
 if(n>=1e6){s+=words(Math.floor(n/1e6))+" MILLION";n%=1e6;if(n)s+=" ";}
 if(n>=1000){s+=words(Math.floor(n/1000))+" THOUSAND";n%=1000;if(n)s+=" ";}
 if(n>0)s+=below1000(n);
 return s;
}
function formatAmount(v){
 v=v.replace(/\D/g,"");
 if(!v)return "";
 v=v.replace(/^0+(?=\d)/,"");
 return v.replace(/\B(?=(\d{3})+(?!\d))/g,",");
}
function getCentavos(){
 let v=document.getElementById("centavos").value.replace(/\D/g,"").slice(0,2);
 return (v||"00").padStart(2,"0");
}
function update(){
 const a=document.getElementById("amount"), c=document.getElementById("centavos"), suffix=document.getElementById("suffix");
 a.value=formatAmount(a.value);
 c.value=c.value.replace(/\D/g,"").slice(0,2);
 const cent=getCentavos();

 // IMPORTANT: The displayed .00 changes to the actual centavos.
 suffix.textContent="."+cent;

 if(!a.value){document.getElementById("result").textContent="";return;}
 const whole=Number(a.value.replace(/,/g,""));
 if(!Number.isSafeInteger(whole)){document.getElementById("result").textContent="AMOUNT TOO LARGE";return;}

 let text=words(whole)+" PESO"+(whole===1?"":"S");
 if(Number(cent)>0)text+=" AND "+cent+"/100";
 text+=" ONLY";
 document.getElementById("result").textContent=text;
}

const amount=document.getElementById("amount");
const centavos=document.getElementById("centavos");

amount.addEventListener("input",update);
centavos.addEventListener("input",update);

centavos.addEventListener("focus",function(){
 if(this.value==="00")this.select();
});
centavos.addEventListener("blur",function(){
 this.value=(this.value||"00").padStart(2,"0");
 update();
});

amount.addEventListener("keydown",function(e){
 if(e.key==="ArrowRight"&&this.selectionStart===this.value.length){
  e.preventDefault();centavos.focus();centavos.select();
 }
});
centavos.addEventListener("keydown",function(e){
 if(e.key==="ArrowLeft"&&this.selectionStart===0){
  e.preventDefault();amount.focus();amount.setSelectionRange(amount.value.length,amount.value.length);
 }
 if(e.key==="ArrowRight"&&this.selectionStart===this.value.length){
  e.preventDefault();amount.focus();amount.setSelectionRange(amount.value.length,amount.value.length);
 }
});
// ENTER workflow:
// Start at CENTAVOS -> Enter moves to AMOUNT.
// From AMOUNT -> Enter copies the final result.
centavos.addEventListener("keydown",function(e){
 if(e.key==="Enter"){
  e.preventDefault();
  amount.focus();
  amount.setSelectionRange(amount.value.length,amount.value.length);
 }
});

amount.addEventListener("keydown",function(e){
 if(e.key==="Enter"){
  e.preventDefault();
  copyResult();
 }
});

async function copyResult(){
 const text=document.getElementById("result").textContent.trim();
 if(!text) return;

 // Try modern Clipboard API first.
 try{
   if(navigator.clipboard && window.isSecureContext){
     await navigator.clipboard.writeText(text);
     showCopyStatus("COPIED!");
     return;
   }
 }catch(err){}

 // Fallback for Google Sites / iframe environments.
 try{
   const ta=document.createElement("textarea");
   ta.value=text;
   ta.setAttribute("readonly","");
   ta.style.position="fixed";
   ta.style.left="-9999px";
   ta.style.top="0";
   document.body.appendChild(ta);
   ta.focus();
   ta.select();
   ta.setSelectionRange(0,ta.value.length);
   const ok=document.execCommand("copy");
   document.body.removeChild(ta);
   if(ok){
     showCopyStatus("COPIED!");
     return;
   }
 }catch(err){}

 showCopyStatus("COPY FAILED — SELECT THE RESULT TO COPY");
}

function showCopyStatus(msg){
 const btn=document.querySelector(".copy");
 const original=btn.textContent;
 btn.textContent=msg;
 setTimeout(()=>btn.textContent=original,1200);
}
function clearAll(){
 amount.value="";
 centavos.value="00";
 document.getElementById("suffix").textContent=".00";
 document.getElementById("result").textContent="";
 amount.focus();
}
update();
window.addEventListener("load",function(){
  centavos.focus();
  centavos.select();
});
</script>
</body>
</html>
